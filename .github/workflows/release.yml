name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  test:
    name: Test Schema
    uses: ./.github/workflows/test-schema.yml

  release:
    runs-on: ubuntu-latest
    needs: test
    name: Publish Release
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version="$GITHUB_REF_NAME"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "::error::tag '$version' is not semver"; exit 1;
        }
        title=$(jq -r .title yaml-ioc-schema.json)
        grep -qF "$version" <<< "$title" || {
          echo "::error::schema title '$title' does not contain $version"; exit 1;
        }
        gh release create "$version" \
          --title "$title" \
          --generate-notes \
          yaml-ioc-schema.json
